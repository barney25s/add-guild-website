# Render Blueprint: static site (free). Render reads this file automatically
# when you choose New + > Blueprint and select your GitHub repo.
services:
  - type: web
    name: add-guild
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
